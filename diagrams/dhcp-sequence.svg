<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <style>
    .actor { fill:#f8f9fa; stroke:#222; stroke-width:1.2; rx:6; }
    .text { font: 13px/1.2 sans-serif; fill:#111; }
    .arrow { stroke:#222; stroke-width:1.4; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222" />
    </marker>
  </defs>

  <rect x="30" y="30" width="150" height="50" class="actor"/>
  <text x="105" y="60" text-anchor="middle" class="text">Client</text>

  <rect x="230" y="20" width="220" height="80" class="actor"/>
  <text x="340" y="50" text-anchor="middle" class="text" font-weight="bold">DnsForwarder (DHCP)</text>

  <rect x="500" y="30" width="150" height="50" class="actor"/>
  <text x="575" y="60" text-anchor="middle" class="text">Allocator</text>

  <!-- Flow -->
  <path d="M180 55 L230 55" class="arrow" />
  <text x="200" y="43" class="text">DISCOVER</text>

  <path d="M450 55 L500 55" class="arrow" />
  <text x="470" y="43" class="text">Allocate(used)</text>

  <path d="M500 95 L450 95" class="arrow" />
  <text x="470" y="83" class="text">IP / null</text>

  <path d="M230 100 L180 100" class="arrow" />
  <text x="200" y="88" class="text">OFFER (with IP)</text>

  <path d="M180 125 L230 125" class="arrow" />
  <text x="200" y="112" class="text">REQUEST</text>

  <path d="M230 150 L180 150" class="arrow" />
  <text x="200" y="138" class="text">ACK</text>

  <text x="20" y="340" class="text">Static SVG: DHCP simplified flow (DISCOVER → OFFER → REQUEST → ACK)</text>
</svg>

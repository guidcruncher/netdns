<body>
<h1>Caching</h1>

<p>
DnsForwarder extracts TTL from upstream responses and stores answers in DnsCache.
TTL is capped by <code>CachingOptions.TtlSeconds</code>.
</p>

<pre><code>{
  "Caching": {
    "Enabled": true,
    "TtlSeconds": 300,
    "MaxEntries": 10000
  }
}
</code></pre>
</body>
</html>

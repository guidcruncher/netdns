<h1>Upstream Resolvers</h1>

<p>
Resolvers define where DNS queries are forwarded.
Rules determine which resolver is selected.
</p>

<pre><code>{
  "Name": "cloudflare",
  "Address": "1.1.1.1",
  "Port": 53,
  "Rule": "*.example.com"
}
</code></pre>
</body>

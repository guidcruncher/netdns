<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>
    .box { fill:#f8f9fa; stroke:#2b2f33; stroke-width:1.5; rx:6; }
    .title { font: bold 14px sans-serif; fill:#111; }
    .label { font: 12px sans-serif; fill:#111; }
    .arrow { stroke:#2b2f33; stroke-width:1.5; fill:none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b2f33" />
    </marker>
  </defs>

  <!-- Client -->
  <rect x="20" y="40" width="140" height="60" class="box"/>
  <text x="90" y="70" text-anchor="middle" class="title">Client</text>

  <!-- DnsForwarder -->
  <rect x="200" y="20" width="200" height="100" class="box"/>
  <text x="300" y="55" text-anchor="middle" class="title">DnsForwarder</text>
  <text x="300" y="75" text-anchor="middle" class="label">DNS / DHCP / NTP</text>

  <!-- RuleEngine -->
  <rect x="440" y="20" width="140" height="60" class="box"/>
  <text x="510" y="50" text-anchor="middle" class="title">RuleEngine</text>

  <!-- Cache -->
  <rect x="440" y="120" width="140" height="60" class="box"/>
  <text x="510" y="150" text-anchor="middle" class="title">DnsCache</text>

  <!-- Upstreams -->
  <rect x="640" y="20" width="140" height="60" class="box"/>
  <text x="710" y="50" text-anchor="middle" class="title">Upstream Resolvers</text>

  <!-- Blocklists -->
  <rect x="640" y="120" width="140" height="60" class="box"/>
  <text x="710" y="150" text-anchor="middle" class="title">Blocklist Sources</text>

  <!-- Metrics -->
  <rect x="200" y="140" width="120" height="50" class="box"/>
  <text x="260" y="170" text-anchor="middle" class="title">Metrics</text>
  <text x="260" y="185" text-anchor="middle" class="label">EventBus / Prometheus</text>

  <!-- Arrows -->
  <path d="M160 70 L200 70" class="arrow" />
  <path d="M400 70 L440 70" class="arrow" />
  <path d="M580 50 L640 50" class="arrow" />
  <path d="M580 140 L640 140" class="arrow" />
  <path d="M300 120 L300 140" class="arrow" />
  <path d="M300 95 L440 95" class="arrow" />

  <!-- Labels on arrows -->
  <text x="180" y="58" class="label">DNS / DHCP / NTP</text>
  <text x="420" y="58" class="label">Match rules</text>
  <text x="565" y="40" class="label">Resolve/Forward</text>
  <text x="565" y="130" class="label">Load rules</text>
  <text x="330" y="132" class="label">Metrics/Events</text>

  <!-- Footer -->
  <text x="20" y="400" class="label">Generated static SVG diagram: High-level components</text>
</svg>

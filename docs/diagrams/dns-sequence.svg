<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <style>
    .actor { fill:#f8f9fa; stroke:#222; stroke-width:1.2; rx:6; }
    .text { font: 13px/1.2 sans-serif; fill:#111; }
    .arrow { stroke:#222; stroke-width:1.4; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222" />
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="40" y="30" width="160" height="60" class="actor"/>
  <text x="120" y="60" text-anchor="middle" class="text">Client</text>

  <rect x="260" y="20" width="200" height="90" class="actor"/>
  <text x="360" y="50" text-anchor="middle" class="text" font-weight="bold">DnsForwarder</text>

  <rect x="520" y="20" width="140" height="60" class="actor"/>
  <text x="590" y="50" text-anchor="middle" class="text">RuleEngine</text>

  <rect x="260" y="150" width="140" height="60" class="actor"/>
  <text x="330" y="180" text-anchor="middle" class="text">DnsCache</text>

  <rect x="520" y="150" width="160" height="60" class="actor"/>
  <text x="600" y="180" text-anchor="middle" class="text">Upstream</text>

  <!-- Sequence arrows -->
  <path d="M200 60 L260 60" class="arrow" />
  <text x="230" y="48" class="text">UDP: DNS query</text>

  <path d="M460 60 L520 60" class="arrow" />
  <text x="490" y="48" class="text">Match(domain)</text>

  <path d="M360 110 L360 150" class="arrow" />
  <text x="370" y="125" class="text">Check cache</text>

  <path d="M400 180 L520 180" class="arrow" />
  <text x="460" y="168" class="text">Forward (if miss)</text>

  <path d="M680 180 L760 180" class="arrow" />
  <text x="720" y="168" class="text">Upstream response</text>

  <path d="M420 220 L360 220" class="arrow" />
  <text x="390" y="208" class="text">Store in cache</text>

  <path d="M300 220 L200 220" class="arrow" />
  <text x="240" y="208" class="text">Return response (patched ID)</text>

  <text x="20" y="500" class="text">Static SVG: DNS request sequence (simplified)</text>
</svg>

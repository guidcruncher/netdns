<body>
<h1>Installation</h1>

<h2>Requirements</h2>
<ul>
  <li>.NET 8 or later</li>
  <li>Linux, macOS, or Windows</li>
</ul>

<h2>Build from Source</h2>
<pre><code>
git clone https://github.com/yourname/dnsforwarder
cd dnsforwarder
make build
</code></pre>

<h2>Run</h2>
<pre><code>
./dnsforwarder --config config.json
</code></pre>
</body>

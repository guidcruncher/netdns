<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Running</title></head>
<body>
<h1>Running DnsForwarder</h1>

<h2>Start with a config file</h2>
<pre><code>
dnsforwarder --config config.json
</code></pre>

<h2>Run in foreground</h2>
<pre><code>
dnsforwarder
</code></pre>

<h2>Run as a systemd service</h2>
<pre><code>
sudo cp dnsforwarder.service /etc/systemd/system/
sudo systemctl enable dnsforwarder
sudo systemctl start dnsforwarder
</code></pre>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Troubleshooting</title></head>
<body>
<h1>Troubleshooting</h1>

<h2>Check logs</h2>
<pre><code>
journalctl -u dnsforwarder -f
</code></pre>

<h2>Verify DNS resolution</h2>
<pre><code>
dig @127.0.0.1 example.com
</code></pre>

<h2>Enable debug logging</h2>
<pre><code>
"Logging": {
  "Level": "Debug"
}
</code></pre>
</body>
</html>

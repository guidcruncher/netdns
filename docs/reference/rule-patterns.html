<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Rule Patterns</title></head>
<body>
<h1>Rule Patterns</h1>

<h2>Exact</h2>
<pre><code>example.com</code></pre>

<h2>Suffix</h2>
<pre><code>*.example.com</code></pre>

<h2>Prefix</h2>
<pre><code>example.*</code></pre>

<h2>Wildcard substring</h2>
<pre><code>*ads*</code></pre>

<h2>Regex</h2>
<pre><code>^.*example\.com$</code></pre>

</body>
</html>
